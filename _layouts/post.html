---
layout: default
---
<article class="post">
  <header class="page-hero">
    <div class="page-hero-bg" aria-hidden="true"></div>
    <div class="container narrow">
      <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">← News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.category %} · {{ page.category }}{% endif %}</p>
      <h1 class="split-words">{{ page.title }}</h1>
    </div>
  </header>
  <div class="container narrow prose">
    {% if page.image %}<img class="post-cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
    {{ content }}
    <p class="edit-link"><a href="https://github.com/{{ site.github_repo }}/edit/main/{{ page.path }}" target="_blank" rel="noopener">Edit this post on GitHub</a></p>
  </div>
</article>
