# ------------------------------------------------------------------
# PEOPLE
# To add yourself: copy one block under `members`, fill it in, and add a
# square photo (≥400×400 px) to assets/img/people/<firstname-lastname>.jpg
# Leave `photo` empty to show your initials instead.
# `bio` is optional — if present, clicking your card opens a pop-up with it.
#
# group must match one of the `key`s under `groups`.
# When someone leaves, MOVE their block to `alumni` and add `now:`.
# ------------------------------------------------------------------

