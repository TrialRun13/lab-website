{% assign lab = site.data.lab %}
<section class="cta">
  <canvas class="cta-canvas" aria-hidden="true"></canvas>
  <div class="container cta-inner">
    <div>
      <p class="eyebrow eyebrow-light">{{ lab.cta_eyebrow | default: "Join us" }}</p>
      <h2 class="split-words">{{ lab.cta_title }}</h2>
      <p>{{ lab.cta_text }}</p>
    </div>
    <a class="btn btn-light" data-magnetic href="{{ '/join-us/' | relative_url }}">Join the team <span aria-hidden="true">→</span></a>
  </div>
</section>
